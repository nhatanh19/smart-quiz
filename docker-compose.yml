version: "3.8"

services:
  # 1. Relational Database (PostgreSQL 16)
  postgres:
    image: postgres:16-alpine
    container_name: smartquiz_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: smart_quiz
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d smart_quiz"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - smartquiz_net

  # 2. Backend API Service (FastAPI)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smartquiz_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PROJECT_NAME: "Smart Quiz API"
      API_V1_STR: "/api/v1"
      DATABASE_URL: "postgresql+psycopg2://postgres:postgrespassword@postgres:5432/smart_quiz"
      SECRET_KEY: "${SECRET_KEY:-smartquiz_super_secret_production_key_v2_release_2026_xyz}"
      ALGORITHM: "HS256"
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      REFRESH_TOKEN_EXPIRE_DAYS: 7
      COOKIE_SECURE: "false" # Set true when terminating SSL on Nginx
      BACKEND_CORS_ORIGINS: '["http://localhost", "http://localhost:80", "http://127.0.0.1", "http://localhost:5173"]'
      SEED_DEFAULT_PASSWORD: "SmartQuiz@123"
      # If targeting a proxy running on the Docker host (e.g. 9Router/Ollama), use host.docker.internal
      LLM_BASE_URL: "${LLM_BASE_URL:-https://generativelanguage.googleapis.com/v1beta/openai/}"
      LLM_API_KEY: "${LLM_API_KEY:-}"
      LLM_MODEL_NAME: "${LLM_MODEL_NAME:-gemini-2.5-flash}"
      LLM_FALLBACK_MODEL_NAME: "${LLM_FALLBACK_MODEL_NAME:-}"
      LLM_TIMEOUT_SECONDS: "${LLM_TIMEOUT_SECONDS:-30.0}"
      AI_TUTOR_TIMEOUT_SECONDS: "${AI_TUTOR_TIMEOUT_SECONDS:-15.0}"
      AI_TUTOR_MODEL_TIMEOUT_SECONDS: "${AI_TUTOR_MODEL_TIMEOUT_SECONDS:-12.0}"
    expose:
      - "8000"
    networks:
      - smartquiz_net

  # 3. Frontend Web Application (React 18 + Vite)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: "/api/v1"
    container_name: smartquiz_frontend
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - smartquiz_net

  # 4. Reverse Proxy & API Gateway (Nginx)
  proxy:
    image: nginx:1.27-alpine
    container_name: smartquiz_proxy
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - smartquiz_net

volumes:
  postgres_data:
    driver: local

networks:
  smartquiz_net:
    driver: bridge
