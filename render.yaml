# Render Blueprint specification for Smart Quiz Platform
services:
  # 1. Backend Web Service
  - type: web
    name: smart-quiz-backend
    runtime: python
    buildCommand: "cd backend && pip install -r requirements.txt"
    startCommand: "cd backend && alembic upgrade head && python scripts/seed.py --with-demo-exam && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: smart-quiz-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: BACKEND_CORS_ORIGINS
        value: '["https://smart-quiz-frontend.onrender.com"]'
      - key: LLM_BASE_URL
        value: "https://generativelanguage.googleapis.com/v1beta/openai/"
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL_NAME
        value: "gemini-2.5-flash"

  # 2. Frontend Static Site
  - type: web
    name: smart-quiz-frontend
    runtime: static
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: "./frontend/dist"
    routes:
      - type: rewrite
        source: /api/*
        destination: https://smart-quiz-backend.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: "/api/v1"

databases:
  - name: smart-quiz-db
    databaseName: smart_quiz
    user: postgres
    plan: free
