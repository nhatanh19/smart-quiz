# Render Blueprint specification for Smart Quiz Platform (Free Tier)
databases:
  - name: smart-quiz-db
    databaseName: smart_quiz
    region: singapore
    plan: free

services:
  # 1. Backend Web Service (FastAPI + Alembic + Seed)
  - type: web
    name: smart-quiz-backend
    runtime: python
    region: singapore
    plan: free
    healthCheckPath: /health
    buildCommand: "cd backend && pip install -r requirements.txt"
    startCommand: "cd backend && alembic upgrade head && python scripts/seed.py --with-demo-exam && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: DATABASE_URL
        fromDatabase:
          name: smart-quiz-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: BACKEND_CORS_ORIGINS
        # Update with the actual frontend URL if Render appends a random suffix
        value: '["https://smart-quiz-frontend.onrender.com"]'
      - key: LLM_BASE_URL
        value: "https://generativelanguage.googleapis.com/v1beta/openai/"
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL_NAME
        value: "gemini-2.5-flash"
      - key: LLM_TIMEOUT_SECONDS
        value: "30.0"
      - key: AI_TUTOR_TIMEOUT_SECONDS
        value: "15.0"
      - key: AI_TUTOR_MODEL_TIMEOUT_SECONDS
        value: "12.0"

  # 2. Frontend Static Site (React + Vite SPA + Same-Origin API Rewrite)
  - type: web
    name: smart-quiz-frontend
    runtime: static
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: "./frontend/dist"
    routes:
      - type: rewrite
        source: /api/*
        # Update host below if Render appends a suffix to smart-quiz-backend
        destination: https://smart-quiz-backend.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: "/api/v1"
